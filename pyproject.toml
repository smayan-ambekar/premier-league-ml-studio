[project]
name = "premier-league-ml-studio"
version = "0.1.0"
description = "Machine Learning application for player valuation, match prediction and player scouting"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"] # pycodestyle errors, pyflakes, import sorting

[tool.pytest.ini_options]
testpaths = ["tests"]